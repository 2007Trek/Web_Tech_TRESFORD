<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Sign in or create a TREK portfolio member account.">
  <title>Member access | Tresford Mulilima</title>
  <link rel="stylesheet" href="css/auth.css">
  <script type="module" src="js/auth.js"></script>
</head>
<body>
  <main class="auth-shell">
    <a class="back-link" href="index.html">← Back to portfolio</a>
    <section class="auth-card">
      <p class="eyebrow">TREK PORTFOLIO · MEMBERS</p>
      <h1 id="form-title">Welcome back.</h1>
      <p class="muted" id="form-description">Sign in to access your member space.</p>
      <div class="tabs" role="group" aria-label="Account action">
        <button class="tab active" id="signin-tab" type="button">Sign in</button>
        <button class="tab" id="signup-tab" type="button">Create account</button>
      </div>
      <form id="auth-form">
        <label id="name-label" hidden for="full-name">Full name</label>
        <input id="full-name" name="full-name" autocomplete="name" maxlength="80" placeholder="Your full name" hidden>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters">
        <button class="primary" id="submit-button" type="submit">Sign in</button>
      </form>
      <button class="text-button" id="forgot-button" type="button">Forgot your password?</button>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
      <p class="fine-print">By creating an account, you agree to use the member space respectfully. Email verification may be required before access is granted.</p>
    </section>
  </main>
</body>
</html>
